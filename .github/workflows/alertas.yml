name: Vigilante de alertas

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Revisar pronóstico y avisar
        run: node alertas.mjs
        env:
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Guardar alertas ya enviadas
        run: |
          git config user.name "vigilante-clima"
          git config user.email "vigilante-clima@users.noreply.github.com"
          git add enviados.json
          git diff --cached --quiet || (git commit -m "Actualizar alertas enviadas" && git push)
